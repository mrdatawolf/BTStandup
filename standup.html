<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Progress Tracker</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding-bottom: 46px;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .app {
      width: min(780px, calc(100% - 32px));
      margin: 48px auto;
      background: white;
      border-radius: 14px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 { margin: 0 0 24px; font-size: 28px; }

    .add-row {
      display: grid;
      grid-template-columns: 1fr 160px 85px auto;
      gap: 10px;
      margin-bottom: 24px;
    }

    input[type="text"], input[type="date"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
      font-size: 16px;
      background: white;
    }

    input.initials-input, input.edit-initials {
      text-transform: uppercase;
      text-align: center;
      font-weight: 700;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.45;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    .add-button { background: #2563eb; color: white; }
    .add-button:hover { background: #1d4ed8; }

    .entry {
      padding: 16px 0;
      border-top: 1px solid #e5e7eb;
    }

    .entry.dragging { opacity: 0.45; background: #eff6ff; }
    .entry.drag-over { border-top: 3px solid #2563eb; }

    .entry-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 10px;
    }

    .entry-top-left {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      min-width: 0;
    }

    .drag-handle {
      width: 28px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 7px;
      color: #6b7280;
      background: #f3f4f6;
      font-size: 19px;
      line-height: 1;
      letter-spacing: -2px;
      cursor: grab;
      user-select: none;
      flex: 0 0 auto;
    }

    .drag-handle:hover { background: #e0e7ff; color: #3730a3; }
    .drag-handle:active { cursor: grabbing; }

    .entry-title { min-width: 0; cursor: pointer; padding-top: 2px; }
    .entry-title:hover .entry-name { color: #2563eb; text-decoration: underline; }
    .entry-name { display: block; font-weight: 700; overflow-wrap: anywhere; }
    .entry-date { display: block; margin-top: 4px; color: #6b7280; font-size: 14px; }

    .entry-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
    .initials-badge {
      min-width: 38px;
      height: 30px;
      padding: 0 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: #e0e7ff;
      color: #3730a3;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      cursor: pointer;
    }

    .initials-badge.empty {
      background: #f3f4f6;
      color: #6b7280;
      font-weight: 600;
      letter-spacing: 0;
    }

    .notes-button { background: #fef3c7; color: #92400e; }
    .delete-button { background: #fee2e2; color: #b91c1c; }

    .progress-row { display: flex; align-items: center; gap: 12px; }
    input[type="range"] { flex: 1; accent-color: #2563eb; cursor: pointer; }
    .percent { width: 48px; text-align: right; font-weight: 700; color: #2563eb; }

    .bar-background {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      border-radius: inherit;
      transition: width 0.2s ease;
    }

    .notes-panel {
      margin-top: 14px;
      padding: 14px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
    }

    .notes-label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 700; color: #78350f; }
    .notes-actions { display: flex; gap: 8px; margin-top: 10px; }

    .edit-form {
      display: grid;
      grid-template-columns: 1fr 160px 85px auto auto;
      gap: 8px;
      align-items: center;
    }

    .save-button { background: #16a34a; color: white; }
    .cancel-button { background: #e5e7eb; color: #374151; }
    .empty-message { text-align: center; color: #6b7280; padding: 24px 0 8px; }
    .status { min-height: 20px; margin: 12px 0 0; color: #6b7280; font-size: 14px; }
    .status.error { color: #b91c1c; }
    button:disabled, input:disabled, textarea:disabled { cursor: not-allowed; opacity: 0.6; }

    .footer-bar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      border-top: 1px solid #d1d5db;
      background: #ffffff;
      color: #6b7280;
      font-size: 13px;
      box-shadow: 0 -3px 12px rgba(0, 0, 0, 0.04);
    }

    @media (max-width: 680px) {
      .app { margin-top: 20px; padding: 20px; }
      .add-row, .edit-form { grid-template-columns: 1fr; }
      .entry-header { flex-direction: column; }
      .entry-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Progress Tracker</h1>

    <div class="add-row">
      <input id="entryInput" type="text" maxlength="500" placeholder="Type a new entry..." />
      <input id="dateInput" type="date" aria-label="Entry date" />
      <input id="initialsInput" class="initials-input" type="text" maxlength="5" placeholder="Initials" aria-label="Initials" />
      <button class="add-button" id="addButton">Add entry</button>
    </div>

    <section id="entries"></section>
    <p class="status" id="status" aria-live="polite"></p>
  </main>

  <footer class="footer-bar">BT Standup&nbsp;·&nbsp;Version&nbsp;<span id="appVersion">...</span></footer>
  <script src="/app.js"></script>
</body>
</html>
